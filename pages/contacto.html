<!-- FORM SUBMISSION (Google Apps Script Web App)
================================================== -->
<script>
  const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyK55YIb-riCgr9uQHbsHLQnde_U-dp0WycwY3e81p8OJhxrr0Ers_XxUczAmLEmrka/exec";

  const form = document.getElementById("contactForm");
  const statusBox = document.getElementById("formStatus");
  const submitBtn = document.getElementById("submitBtn");

  function setStatus(message, ok = true) {
    statusBox.style.display = "block";
    statusBox.className = ok ? "alert alert-success" : "alert alert-danger";
    statusBox.textContent = message;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!GOOGLE_WEB_APP_URL || !GOOGLE_WEB_APP_URL.startsWith("https://script.google.com/macros/s/")) {
      setStatus("Falta configurar el endpoint del Web App (Google Apps Script).", false);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";

    const payload = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      message: form.message.value.trim(),
      page: window.location.href,
      userAgent: navigator.userAgent
    };

    try {
      // More reliable for Apps Script
      const body = new URLSearchParams(payload);

      await fetch(GOOGLE_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        body
      });

      form.reset();
      setStatus("¡Mensaje enviado! Gracias — te respondo pronto.", true);
    } catch (err) {
      console.error(err);
      setStatus("No se pudo enviar el mensaje. Intentá de nuevo en unos minutos.", false);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Enviar →";
    }
  });
</script>
